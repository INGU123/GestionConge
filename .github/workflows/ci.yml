name: CI

on:
  pull_request:
    branches:
      - feat/circuit-conge-hierarchique
  push:
    branches:
      - fix/professionalisation-globale

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests (Java 17 + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gestionconge_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gestionconge_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_URL: jdbc:postgresql://localhost:5432/gestionconge_ci
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DDL_AUTO: create-drop
      JWT_SECRET: ci-only-secret-never-use-outside-automated-tests-2026
      MAIL_USERNAME: ci@example.invalid
      MAIL_PASSWORD: ci-only-placeholder
      MAIL_FROM_EMAIL: ci@example.invalid
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run backend tests
        run: mvn -B -ntp -f Backend/pom.xml test

  frontend-checks:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/my-app/package-lock.json
      - name: Install dependencies
        working-directory: Frontend/my-app
        run: npm ci
      - name: Lint
        working-directory: Frontend/my-app
        run: npm run lint
      - name: Build
        working-directory: Frontend/my-app
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: npm run build
