name: CI GestionConge

on:
  push:
    branches:
      - feat/circuit-conge-hierarchique
  pull_request:
    branches:
      - feat/circuit-conge-hierarchique

permissions:
  contents: read

jobs:
  backend:
    name: Backend - Maven tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Tests backend
        working-directory: Backend
        run: mvn --batch-mode test -Dnet.bytebuddy.experimental=true

  frontend:
    name: Frontend - Next.js build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/my-app/package-lock.json
      - name: Installer les dépendances
        working-directory: Frontend/my-app
        run: npm ci
      - name: Construire Next.js
        working-directory: Frontend/my-app
        run: npm run build
