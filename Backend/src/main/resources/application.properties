```properties
spring.application.name=GestionConge
spring.config.import=optional:file:.env[.properties]


# =========================================================
# DATABASE - POSTGRESQL
# =========================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/gestionconge
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET:change-me-in-production}


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Évite les requêtes JPA tardives pendant le rendu des vues.
spring.jpa.open-in-view=false


# =========================================================
# SERVER
# =========================================================

server.port=8080
server.error.include-stacktrace=never


# =========================================================
# JSON
# =========================================================

spring.jackson.date-format=yyyy-MM-dd


# =========================================================
# RESEND EMAIL API
# =========================================================

resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:}


# =========================================================
# LOGGING
# =========================================================

logging.level.org.springframework=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.com.zaxxer.hikari=INFO
logging.level.org.springframework.jdbc=INFO

# SQL détaillé désactivé pour éviter de polluer les logs.
logging.level.org.hibernate.SQL=WARN

# Logs de notre service d'envoi d'e-mails.
logging.level.com.fruvio.GestionConge.utilisateur.service.EmailService=INFO
```
