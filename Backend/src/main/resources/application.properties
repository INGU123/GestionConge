spring.application.name=GestionConge

# =========================================================
# CONFIGURATION EXTERNE
# =========================================================
# Charge les variables sensibles depuis .env
spring.config.import=optional:file:.env[.properties],optional:file:Backend/.env[.properties]


# =========================================================
# DATABASE - POSTGRESQL
# =========================================================

# DB_URL permet de remplacer l'adresse locale en déploiement.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestionconge}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# JWT
# =========================================================

# Aucun secret par défaut : JWT_SECRET doit être défini dans .env ou l'environnement.
jwt.secret=${JWT_SECRET}


# =========================================================
# JPA / HIBERNATE
# =========================================================

# Conserver update en local ; définir DDL_AUTO=validate en production et gérer les migrations.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false

# Évite les requêtes JPA tardives pendant le rendu des vues.
spring.jpa.open-in-view=false


# =========================================================
# SERVER
# =========================================================

server.port=8080
server.error.include-stacktrace=never


# =========================================================
# JSON
# =========================================================

spring.jackson.date-format=yyyy-MM-dd


# =========================================================
# EMAIL - BREVO SMTP
# =========================================================

spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# Authentification SMTP
spring.mail.properties.mail.smtp.auth=true

# Brevo : STARTTLS sur le port 587 (SSL direct désactivé)
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Encodage
spring.mail.default-encoding=UTF-8


# =========================================================
# EXPEDITEUR DES EMAILS
# =========================================================

mail.from.email=${MAIL_FROM_EMAIL}
app.frontend.url=${FRONTEND_URL:http://localhost:3000}


# =========================================================
# LOGGING
# =========================================================

logging.level.org.springframework=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.com.zaxxer.hikari=INFO
logging.level.org.springframework.jdbc=INFO

# SQL détaillé désactivé pour éviter de polluer les logs.
logging.level.org.hibernate.SQL=WARN

# Logs de notre service d'envoi d'e-mails.
logging.level.com.fruvio.GestionConge.utilisateur.service.EmailService=INFO