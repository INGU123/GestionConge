spring.application.name=GestionConge

# =========================================================
# CONFIGURATION EXTERNE
# =========================================================
# Charge les variables sensibles depuis .env
spring.config.import=optional:file:.env[.properties],optional:file:Backend/.env[.properties]


# =========================================================
# DATABASE - POSTGRESQL
# =========================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/gestionconge
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET:change-me-in-production}


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Évite les requêtes JPA tardives pendant le rendu des vues.
spring.jpa.open-in-view=false


# =========================================================
# SERVER
# =========================================================

server.port=8080
server.error.include-stacktrace=never


# =========================================================
# JSON
# =========================================================

spring.jackson.date-format=yyyy-MM-dd


# =========================================================
# EMAIL - BREVO SMTP
# =========================================================

spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# Authentification SMTP
spring.mail.properties.mail.smtp.auth=true

# STARTTLS pour le port 465
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Encodage
spring.mail.default-encoding=UTF-8


# =========================================================
# EXPEDITEUR DES EMAILS
# =========================================================

mail.from.email=${MAIL_FROM_EMAIL}
app.frontend.url=${FRONTEND_URL:http://localhost:3000}


# =========================================================
# LOGGING
# =========================================================

logging.level.org.springframework=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.com.zaxxer.hikari=INFO
logging.level.org.springframework.jdbc=INFO

# SQL détaillé désactivé pour éviter de polluer les logs.
logging.level.org.hibernate.SQL=WARN

# Logs de notre service d'envoi d'e-mails.
logging.level.com.fruvio.GestionConge.utilisateur.service.EmailService=INFO