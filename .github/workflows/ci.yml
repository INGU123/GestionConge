name: CI GestionConge

on:
  push:
    branches:
      - feat/circuit-conge-hierarchique
      - fix/reliquats-tous-types-configures
  pull_request:
    branches:
      - feat/circuit-conge-hierarchique
      - fix/reliquats-tous-types-configures

permissions:
  contents: read

jobs:
  backend:
    name: Backend - Maven tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gestionconge
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gestionconge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_URL: jdbc:postgresql://localhost:5432/gestionconge
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ci-only-secret-key-not-used-in-production-0123456789
      MAIL_USERNAME: ci
      MAIL_PASSWORD: ci
      MAIL_FROM_EMAIL: ci@example.com
      DDL_AUTO: update
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Tests backend
        working-directory: Backend
        run: mvn --batch-mode test -Dnet.bytebuddy.experimental=true

  frontend:
    name: Frontend - Next.js build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/my-app/package-lock.json
      - name: Installer les dépendances
        working-directory: Frontend/my-app
        run: npm ci
      - name: Construire Next.js
        working-directory: Frontend/my-app
        run: npm run build
